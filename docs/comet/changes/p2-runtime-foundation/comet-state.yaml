  - id: A12
    source: specs/runtime-foundation/spec.md
    text: 初始化平台运营者后管理密码登录成功 - GIVEN 空库已迁移，并且已经用标明用途的配置执行初始化。 - WHEN
      使用该配置中的登录名和密码调用管理登录，再读取当前用户。 - THEN 返回的平台账号持有平台运营者资格；没有使用开发令牌。
    result: pending
    reason: null
  - id: A13
    source: specs/runtime-foundation/spec.md
    text: 小程序微信登录产生平台账号 - GIVEN 微信登录配置可用，或测试中使用可注入的微信客户端替身。 - WHEN
      使用尚未绑定的微信身份调用小程序登录。 - THEN 创建平台账号和微信身份绑定，并返回小程序会话；该账号不会仅仅因为登录就成为域成员或域运营者。
    result: passed
    reason:
      text: 规格允许注入微信客户端；现有回归验证新微信身份创建平台账号、绑定和小程序会话，不自动获得域成员或运营者资格。
      truncated: false
  - id: A14
    source: specs/runtime-foundation/spec.md
    text: 开发令牌不能作为正式授权 - GIVEN API 已经按本规格运行。 - WHEN 只携带旧式开发令牌、不携带正式会话访问需要身份的接口。 -
      THEN 请求被拒绝；系统没有把开发令牌当作生产授权。
    result: passed
    reason:
      text: HTTP 回归确认仅带 X-Dev-Token 读取身份返回 401；生产授权读取正式会话并校验账号状态。
      truncated: false
  - id: A15
    source: specs/runtime-foundation/spec.md
    text: 正式小程序锁浅色且保留深色源 - GIVEN 正式小程序工程已经创建。 - WHEN 检查 `manifest` / `theme.json` /
      页面与组件样式，以及源码中的主题相关 API。 - THEN `darkmode` 已关闭；窗口与 tabBar
      为浅色字面值；`theme.json` 仍含 `dark` 段；深色媒体查询以注释保留且未被删除；没有 JS 涂色作为主题机制。
    result: passed
    reason:
      text: 静态核对确认关闭 Dark Mode、使用浅色窗口/tabBar 值、保留 dark 段及注释媒体查询；主题监听不执行 JS 涂色。
      truncated: false
  - id: A16
    source: specs/runtime-foundation/spec.md
    text: 本轮未把发布闭环写成已完成 - GIVEN 读者核对本轮交付说明和可运行界面。 - WHEN 寻找指定域运营者、入域审批、发布或阅读。 - THEN
      这些能力被标明未交付；本轮可验证的是骨架、空库和登录/身份。
    result: passed
    reason:
      text: 管理页、小程序占位页、身份返回及交付说明一致标明后续业务未交付，没有将空表视为发布闭环完成。
      truncated: false
  - id: A17
    source: specs/runtime-foundation/spec.md
    text: 并发身份操作保持唯一性并能回滚 - GIVEN 隔离仓库中的首位运营者尚未创建，或同一账号同时发起两个同受众登录。 - WHEN
      并发执行初始化或会话轮换，并模拟事务中途失败。 - THEN 最多一个首位初始化成功；轮换后最多一枚会话有效；失败写入回滚且不破坏原有效会话。
    result: passed
    reason:
      text: 初始化使用事务级 advisory lock，会话轮换使用账号行锁；Runtime 临时 PostgreSQL
        检查通过，覆盖并发唯一性、初始化失败回滚和轮换失败保留原会话。
      truncated: false
  - id: A18
    source: specs/runtime-foundation/spec.md
    text: 临时故障和迟到响应不会损坏当前会话 - GIVEN 用户已有会话，或登录的身份读取尚未结束。 - WHEN 刷新遇到网络或 5xx
      故障、凭据被明确拒绝，或旧响应在状态变化后到达。 - THEN
      临时故障保留可重试凭据并显示错误；明确失效清除身份；旧响应不能恢复失效身份或覆盖新会话；已离开登录页时不会被强制导航。
    result: passed
    reason:
      text: 共享会话控制器保留网络及 5xx 故障凭据、清除明确失效身份，并通过版本和令牌快照拒绝旧响应；三端适配回归及微信登录页离开后禁止迟到导航回归通过。
      truncated: false
  - id: A19
    source: specs/runtime-foundation/spec.md
    text: 注销结果明确且可重试 - GIVEN 用户发起注销或重复点击注销。 - WHEN 注销失败后重试，或旧注销响应在新会话建立后到达。 - THEN
      重复请求合并；失败有可见反馈和重试机会；成功或 401 后完成退出；迟到结果不清除新会话。
    result: passed
    reason:
      text: 注销合并重复请求，失败保留凭据并提供可见重试入口，成功或明确失效后退出；快照校验及迟到注销回归确认不会清除替换后的令牌。
      truncated: false
  - id: A20
    source: specs/runtime-foundation/spec.md
    text: 数据库配置不会失真或泄漏凭据 - GIVEN 使用隔离的虚构数据库连接串和可注入的 SSL 探测。 - WHEN SSL 需要回退或连接串无法解析。
      - THEN 实际驱动配置与选定模式一致，解析错误及日志不含密码；README 与新库边界一致。
    result: passed
    reason:
      text: 连接串统一解析并移除二次解析入口，最终 SSL 配置传入驱动；故障回退及错误脱敏回归通过，README 常规初始化仅指导新库迁移和初始化。
      truncated: false
  - id: A21
    source: specs/runtime-foundation/spec.md
    text: 开发入口安全且工程检查通过 - GIVEN 正式工程依赖已安装。 - WHEN 运行三端构建、Vue/TypeScript 检查，并以不受信任的
      Origin 请求开发服务器的非敏感样例。 - THEN 构建和类型检查通过；可运行的开发服务器不允许该 Origin
      跨源读取；小程序没有开放不在范围内的 Web 开发服务。
    result: passed
    reason:
      text: Runtime 三端构建和 Vue/TypeScript 检查通过；工具链回归实际验证两套后台拒绝不受信任 Origin 跨源读取及 API
        工作区文件访问，小程序拒绝 HTTP serve 和非微信构建入口。
      truncated: false
  - id: A22
    source: specs/runtime-foundation/spec.md
    text: 登录接口拒绝非对象 JSON - GIVEN 请求体是合法 JSON，但顶层为 `null`、数组或原始值。 - WHEN 调用任一登录接口。 -
      THEN 返回 400 参数错误，不触发 500 内部故障。
    result: passed
    reason:
      text: 两个登录接口均在解析后要求顶层 JSON 对象；HTTP 回归覆盖 null、数组、字符串、数字和布尔值，均返回 400 invalid_body。
      truncated: false
