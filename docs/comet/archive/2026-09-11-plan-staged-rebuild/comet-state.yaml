    - id: workspace-documents
      name:
        text: Workspace isolation and document references
        truncated: false
      argv_display:
        - text: -NoProfile
          truncated: false
        - text: -Command
          truncated: false
        - text: |-
            $ErrorActionPreference = 'Stop'
            $taskBaseline = Get-Content -LiteralPath 'D:\Project\WECHAT-PROJECT-information-review\20260910\rebuild-bootstrap\bootstrap-validation.json' -Raw | ConvertFrom-Json
            $taskLegacyRoot = $taskBaseline.legacyBefore.Root
            $taskHead = git -C $taskLegacyRoot rev-parse HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect legacy HEAD' }
            $taskStatus = @(git -C $taskLegacyRoot status --short)
            if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect legacy status' }
            if ($taskHead -ne $taskBaseline.legacyBefore.Head) { throw 'Legacy HEAD changed' }
            if (($taskStatus -join [Environment]::NewLine) -cne ($taskBaseline.legacyBefore.Status -join [Environment]::NewLine)) { throw 'Legacy status changed' }
            foreach ($taskFile in $taskBaseline.legacyBefore.Files) {
              if ((Get-FileHash -LiteralPath (Join-Path $taskLegacyRoot $taskFile.Path) -Algorithm SHA256).Hash -ne $taskFile.SHA256) { throw ('Legacy file changed: ' + $taskFile.Path) }
            }
            $taskNewRoot = git rev-parse --show-toplevel
            $taskOldRoot = git -C $taskLegacyRoot rev-parse --show-toplevel
            if ($taskNewRoot -eq $taskOldRoot) { throw 'Git roots are not isolated' }
            if ((Get-FileHash -LiteralPath 'AGENTS.md').Hash -ne (Get-FileHash -LiteralPath 'CLAUDE.md').Hash) { throw 'Host instructions differ' }
            foreach ($taskBusinessPath in @('apps','packages','src','package.json','.env')) {
              if (Test-Path -LiteralPath $taskBusinessPath) { throw ('Unexpected business path: ' + $taskBusinessPath) }
            }
            $taskDocs = @('README.md','AGENTS.md','CLAUDE.md','docs/project/overview.md','docs/project/rebuild-plan.md','docs/comet/changes/plan-staged-rebuild/brief.md','docs/comet/changes/plan-staged-rebuild/specs/rebuild-plan/spec.md')
            foreach ($taskDoc in $taskDocs) {
              $taskAbs = (Resolve-Path -LiteralPath $taskDoc).Path
              $taskText = Get-Content -LiteralPath $taskAbs -Raw
              if ($taskText -match '(?m)^(<<<<<<<|=======|>>>>>>>)' -or $taskText -match '(?m)[\t ]+\r?$') { throw ('Document hygiene failure: ' + $taskDoc) }
              foreach ($taskLink in [regex]::Matches($taskText, '\]\(([^)]+)\)')) {
                $taskTarget = $taskLink.Groups[1].Value
                if ($taskTarget -match '^(https?://|#|/)') { continue }
                $taskRelative = ($taskTarget -split '#')[0]
                if ($taskRelative -and -not (Test-Path -LiteralPath (Join-Path ([System.IO.Path]::GetDirectoryName($taskAbs)) $taskRelative))) { throw ('Unresolved document link: ' + $taskDoc + ' -> ' + $taskTarget) }
              }
            }
            [pscustomobject]@{legacyHeadUnchanged=$true;legacyStatusUnchanged=$true;legacyFileHashesChecked=$taskBaseline.legacyBefore.Files.Count;gitRootsIndependent=$true;hostInstructionsMatch=$true;businessPathsAbsent=$true;documentsChecked=$taskDocs.Count} | ConvertTo-Json
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 796
