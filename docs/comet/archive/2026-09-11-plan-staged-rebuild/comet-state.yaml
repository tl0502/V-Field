      三档需求被保留，根因与原生控制能力没有被假定为已证实，iOS 也没有被计为已验证通过。
    result: passed
    reason:
      text: 三档主题完整保留，Android/开发工具问题标为用户报告，根因和原生界面控制能力待验证，iOS 明确未测试，没有新增真机通过结论。
