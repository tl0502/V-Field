  - id: A16
    source: specs/rebuild-plan/spec.md
    text: 正确解释当前阶段的完成 - GIVEN 整体规划后续通过验收。 - WHEN 用户查看当前产物与进度。 - THEN
      能区分规划已交付与业务尚未实现，且不会发现未经确认就已经执行的主题、登录、编辑器或数据库迁移任务。
