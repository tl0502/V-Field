        truncated: false
      argv_display:
        - text: -e
          truncated: false
        - text: const {spawnSync}=require('node:child_process'); const
            r=spawnSync(process.execPath,['C:/Program
            Files/nodejs/node_global/node_modules/@rpamis/comet/bin/comet.js','knowledge','query','.',
            '--task','独立新版重建规划 功能恢复清单 F01 F12 原则上全部保留 不迁移
            空数据','--phase','verify','--json'],{encoding:'utf8',windowsHide:true,timeout:55000,maxBuffer:8*1024*1024});
            if(r.error) throw r.error;
            if(r.status!==0){process.stderr.write(r.stderr||'Knowledge query
            failed'); process.exit(r.status||1);} const
            q=JSON.parse(r.stdout.replace(/^\uFEFF/,'')); const
            results=q.result?.results; if(!Array.isArray(results)) throw new
            Error('Knowledge results are not an array');
            if(!results.some(x=>x.source==='docs/project/rebuild-plan.md'))
            throw new Error('Plan missing from knowledge results'); const
            diagnostics=[...(q.diagnostics||[]),...(q.result.diagnostics||[])];
            if(diagnostics.length) throw new Error('Knowledge query diagnostics
            present'); const allowed=new
            Set(['docs/project/overview.md','docs/project/rebuild-plan.md']);
            if(results.some(x=>!allowed.has(x.source))) throw new
            Error('Unexpected knowledge source');
            console.log(JSON.stringify({provider:q.provider,results:results.map(({source,title})=>({source,title})),diagnostics},null,2));
          truncated: false
      argv_truncated: false
      cwd_ref: .
      status: passed
      exit_code: 0
      duration_ms: 1107
