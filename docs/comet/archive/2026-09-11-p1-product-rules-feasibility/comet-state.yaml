    source: brief.md
    text: "A2:
      存在核心用户流程与旧页面的对照：哪些布局/视觉/交互优先复用，哪些因新规则、三档主题或小程序限制需要适配，以及理由；没有把独立重建解释为默认整套改\
      版。"
    result: passed
    reason:
      text: 旧 UI 对照表区分优先复用与入域/归属/主题适配及理由；明确不因重建默认整套改版、不承诺逐像素。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3:
      关键平台限制有结论或明确未验证边界，覆盖应用可控界面与导航/tabBar/首帧背景，并区分授权弹窗、键盘等原生界面；不把旧主题问题写成已经复现、已\
      经修复或 iOS 已测。"
    result: passed
    reason:
      text: feasibility 覆盖可控界面、自定义顶栏、原生 tabBar、首帧；自定义 tabBar 标未验；弹窗/键盘与业务区分开。旧 Android
        主题未写成已复现/已修复，iOS 保持未测。用户判定模拟器与真机 CHECKLIST 通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 产物明确首期完整用户闭环和技术选型依据；该闭环所需的身份、归属与权限出现在合同中；同时写明本 change 不实现该闭环界面。"
    result: passed
    reason:
      text: 五步首期闭环与 uni-app/自建 API/两套网页选型已写；所需身份权限在合同中；同时写明本 change 不实现闭环界面。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 本 change
      完成后，工作区仍能区分规则/可行性交付与业务尚未实现；没有正式业务源码、数据库、密钥迁入或旧库清理执行记录。若存在可行性实验原型，必须标明为实验且\
      不能当作 P2 正式基础。"
    result: passed
    reason:
      text: 仓库根无正式
        package.json/apps/src；无业务库、密钥迁入或旧库清理执行记录。experiments/p1-uniapp-probe
        标明实验且不能当 P2 基础。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6:
      管理端登录合同写明与小程序同一套平台账号；首期可验收路径为平台账号加管理密码；网页微信扫码登录列为待验证增强能力，并记录开放平台网站应用、开发者资\
      质、UnionID 绑定及个人主体限制；未验证不得写成已经开通。"
    result: passed
    reason:
      text: 管理端与小程序同一平台账号；首期可验收为账号+管理密码；扫码登录为待验证增强，并记录开放平台/资质/UnionID/个人主体，未写成已开通。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: P1 写出首期核心实体及其归属关系，不把表名、字段、类型或迁移脚本写成已冻结的数据库设计。"
    result: passed
    reason:
      text: 首期实体与归属表已写出；明确不冻结表名、字段、类型或迁移。
      truncated: false
  - id: A8
    source: specs/product-rules/spec.md
    text: 正确解释 P1 完成 - GIVEN P1 产物已经可以审阅。 - WHEN 用户查看工作区、规则文档和进度。 - THEN
      能区分规则/可行性已交付与业务尚未实现；若存在实验原型，它被标明为实验；不会发现未经确认就完成的登录、发布、管理后台或数据库迁移任务。
    result: passed
    reason:
      text: README/规则/可行性可区分规则已交付与业务未实现；探针标明实验；未见未经确认的登录/发布/后台/迁移完成。
      truncated: false
  - id: A9
    source: specs/product-rules/spec.md
    text: 角色不能互相替代 - GIVEN 读者审阅 P1 角色合同。 - WHEN 对照首期闭环中的指定运营者、申请、审批、发布和阅读。 - THEN
      每个步骤都对应明确角色；登录用户、域成员、域运营者和平台运营者没有被写成同一个身份。
    result: passed
    reason:
      text: 访客、平台账号用户、域成员、域运营者、平台运营者分列；闭环各步对应不同角色，未合并为同一身份。
      truncated: false
  - id: A10
    source: specs/product-rules/spec.md
    text: 实体合同不升级成表结构 - GIVEN 读者查看 P1 的数据合同。 - WHEN 核对其详细程度。 - THEN
      能看到上述实体和归属关系，并且没有把 CREATE TABLE、字段类型或迁移脚本写成已经批准的数据库设计。
    result: passed
    reason:
      text: 实体合同停留在归属关系；product-rules 无 CREATE TABLE/字段类型/迁移脚本。
      truncated: false
  - id: A11
    source: specs/product-rules/spec.md
    text: 内容同时具备作者和业务域 - GIVEN 一条用户可见内容出现在规则示例或合同中。 - WHEN 检查它的归属。 - THEN
      同时存在作者和所属业务域；没有把无域内容或「域只是筛选」写成正式模型。
    result: passed
    reason:
      text: 合同要求可见内容同时有作者与业务域；禁止无域信息流和把域仅当分类。
      truncated: false
  - id: A12
    source: specs/product-rules/spec.md
    text: 发布前必须是域成员 - GIVEN 一个已登录但不是某域成员的用户。 - WHEN 核对该域的发布权限。 - THEN
      合同要求先申请并获域运营者批准；未批准前不能发布。
    result: passed
    reason:
      text: 发布是域成员权限；已登录非成员须申请并经域运营者批准，未批准不能发布。
      truncated: false
  - id: A13
    source: specs/product-rules/spec.md
    text: 访客可以阅读已发布内容 - GIVEN 一条已发布且有效的汽车验证域内容。 - WHEN 未登录访客打开列表或详情。 - THEN
      合同允许阅读公开字段；草稿和仅本人字段保持不可见。
    result: passed
    reason:
      text: 未登录访客可阅读已发布有效内容的公开字段；草稿与仅本人字段不可见。
      truncated: false
  - id: A14
    source: specs/product-rules/spec.md
    text: 首期闭环步骤完整 - GIVEN 读者按 P1 产物走查首期目标。 - WHEN 从指定运营者到访客阅读。 - THEN
      能看到上述五步及所需权限；主题专项、完整资料或消息关注没有被写成该闭环的必过项。
    result: passed
    reason:
      text: 指定运营者→申请→审批→成员发布→访客阅读五步完整；主题专项、完整资料、消息关注未列入该闭环必过。
      truncated: false
  - id: A15
    source: specs/product-rules/spec.md
    text: 两套后台只要求最小切片 - GIVEN 读者查看管理后台范围。 - WHEN 核对待交付能力和后置项。 - THEN
      平台级至少能指定汽车域运营者，域级至少能审批入域申请；完整运营产品没有被写成首期必交付。
    result: passed
    reason:
      text: 平台级最小切片为指定汽车域运营者，域级为审批入域；完整运营/建域等明确后置。
      truncated: false
  - id: A16
    source: specs/product-rules/spec.md
    text: 管理端登录有可验收退路 - GIVEN 用户没有企业资质，网页微信登录能力未证实。 - WHEN 阅读管理端登录合同。 - THEN
      首期可验收路径是同一平台账号加管理密码；扫码登录被列为待验证增强能力，并写明开放平台/UnionID/个人主体限制。
    result: passed
    reason:
      text: 无企业资质时首期退路为同账号加管理密码；扫码登录待验证并写明开放平台/UnionID/个人主体限制。
      truncated: false
  - id: A17
    source: specs/product-rules/spec.md
    text: 对照表区分复用与新建 - GIVEN 读者查看流程与旧页面对照。 - WHEN 检查用户端和管理端。 - THEN
      用户端列出优先复用的旧布局/交互，以及入域、归属、主题或平台限制导致的适配；管理端标明旧后台无业务界面、属于必要新建。
    result: passed
    reason:
      text: 用户端列出旧页复用与入域/归属/主题适配；管理端标明旧后台无业务 UI、属必要新建。
      truncated: false
  - id: A18
    source: specs/product-rules/spec.md
    text: 选型被写清且不假装已经落地 - GIVEN 读者查看技术选型。 - WHEN 核对本 change 的工作区。 - THEN 能看到 uni-app
      用户端、自建 API 与独立数据库、两套管理网页的依据；同时能看出它们尚未作为正式业务工程落地。
    result: passed
    reason:
      text: 选型写明 uni-app+Vue3 仅微信、自建 API+独立库、两套独立网页；工作区未见正式业务工程落地。
      truncated: false
  - id: A19
    source: specs/product-rules/spec.md
    text: 主题与原生界面限制有边界 - GIVEN P1 可行性结论已经写入。 - WHEN 读者查看主题和原生界面。 - THEN
      规划层三档需求仍被记录；微信端合同是跟随系统，强制浅色/深色没有被写成微信端无闪能力；应用可控区域与微信/系统/输入法控制区域被区分；未跑的真机、iOS
      或系统浅切深检查没有被写成通过。
    result: passed
    reason:
      text: 规划层仍记三档；微信端只跟随系统，强制浅/深未写成无闪能力。可控区与授权弹窗/键盘已区分。浅切深为用户 CHECKLIST
        判定，不是旧问题已修复；iOS 与旧 Android 复现保持未跑。
      truncated: false
  - id: A20
    source: specs/product-rules/spec.md
    text: 个人主体限制不被夸大或忽略 - GIVEN 用户说明当前小程序没有企业申请。 - WHEN 阅读可行性结论。 - THEN
      个人主体在认证、支付、开放平台绑定等方面的限制被记录为已知风险或已核对事实；没有把未开通能力写成已经可用，也没有把整个产品端判为不可做。
    result: passed
    reason:
      text: 个人主体在认证、支付、开放平台绑定上的限制已记为已知风险；未写成已开通，也未把产品端判为不可做。
      truncated: false
  - id: A21
    source: specs/product-rules/spec.md
    text: 安全缺口保持显式 - GIVEN 读者查看治理边界。 - WHEN 对照发布和管理操作。 - THEN
      合同要求正式授权；开发令牌和头像校验没有被写成完整安全能力。
    result: passed
    reason:
      text: 真实发布/管理要求正式身份与授权；X-Dev-Token 与头像校验被明确排除在完整安全能力之外。
      truncated: false
